name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Gradle ${{ matrix.gradle }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gradle: ["8.10.2", "9.8.0"]
        java: ["17"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Unit, TestKit, and plugin validation
        run: gradle check validatePlugins --no-daemon
      - name: Validate Plugin Portal metadata
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if [ -n "$GRADLE_PUBLISH_KEY" ] && [ -n "$GRADLE_PUBLISH_SECRET" ]; then
            gradle publishPlugins --validate-only --no-daemon
          else
            echo "Skipped: configure the Gradle Plugin Portal publishing secrets to run authenticated metadata validation."
          fi
      - name: Verify basic example
        run: gradle -p examples/basic verifyCalendarFixtures --no-daemon
      - name: Verify Kotlin DSL example
        run: gradle -p examples/kotlin-dsl verifyCalendarFixtures --no-daemon
      - name: Verify Groovy DSL example
        run: gradle -p examples/groovy-dsl verifyCalendarFixtures --no-daemon
      - name: Verify fixture example
        run: gradle -p examples/fixture-verification verifyCalendarFixtures --no-daemon
